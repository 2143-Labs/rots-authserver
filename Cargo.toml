# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "rots-authserver"
version = "1.0.0"
edition = "2024"

[features]
default = []

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
axum = { version = "0.8.8", features = [ "tracing", "multipart", "json", "macros", "ws", ] }
clap = { version = "4.5.54", features = ["derive", "env"] }
cookie = { version = "0.18.1" }
derive_more = { version = "2.1.1", features = [ "deref", "deref_mut", "display", "from_str", ] }
dotenvy = "0.15.7"
futures = "0.3.31"
hashbrown = { version = "0.16.1", features = ["serde"] }
http-body-util = { version = "0.1.3" }
http = { version = "1.4.0" }
mockall = { version = "0.14.0" }
paste = { version = "1.0.15" }
rand = "0.9.2"
reqwest = { version = "0.13.1", features = [ "json", "rustls", "form" ], default-features = false }
serde_json = { version = "1.0.149" }
serde = { version = "1.0.228", features = ["derive"] }
sqlx-core = { version = "0.8.6" }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "migrate", "macros"] }
struct-patch = { version = "0.10.4" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = [ "cors", "fs", "set-header", "normalize-path", ] }
tower = { version = "0.5.3", features = ["util", "limit"] }
tracing = "0.1.44"
urlencoding = { version = "2.1.3" }
url = { version = "2.5.8" }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
