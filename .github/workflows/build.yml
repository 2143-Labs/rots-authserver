name: Version, build  and Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-release-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux build (Nix)
    runs-on: [self-hosted, nixos]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build with Nix
        run: nix build .#server

      - name: Collect Linux executables
        run: |
          # Check for client executable (default package)
          if [ -x result/bin/rots-authserver ]; then
            cp -L result/bin/rots-authserver rots-authserver-linux
            chmod +x rots-authserver-linux
          fi

      - name: Build container with Nix
        run: nix build .#container


      - name: Push container with skopeo
        run: |
          set -euo pipefail
          skopeo login --username ${{ github.actor }} --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          ls -la ./result
          RESULT=$(readlink -f ./result)
          echo "Result path: $RESULT"
          IMAGE_TAG=$(date +%Y%m%d_%H%M)
          skopeo copy docker-archive://$RESULT docker://ghcr.io/2143-labs/rots-authserver:server-${IMAGE_TAG}
          # if not pull request, then also push as latest
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            skopeo copy docker-archive://$RESULT docker://ghcr.io/2143-labs/rots-authserver:server-branch-${{ github.head_ref }}
          else
            skopeo copy docker-archive://$RESULT docker://ghcr.io/2143-labs/rots-authserver:server-latest
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: |
            rots-authserver-linux
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: [self-hosted, nixos]
    needs:
      - build-linux
    # Only create releases on master branch pushes, not PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create tag name and version name
        id: version-info
        run: |
          echo "TAG_NAME=v${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version-info.outputs.TAG_NAME }}
          name: Release ${{ steps.version-info.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          target_commitish: master
          files: |
            dist/rots-authserver-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
